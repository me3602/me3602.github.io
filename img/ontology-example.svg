<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <style>
      text { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Helvetica Neue', Arial, sans-serif; }
      .title { font-size: 18px; font-weight: bold; fill: #1a237e; }
      .subtitle { font-size: 11px; fill: #5c6bc0; }
      .class-label { font-size: 13px; font-weight: bold; fill: #1565c0; }
      .instance-label { font-size: 12px; font-weight: bold; fill: #1b5e20; }
      .prop-label { font-size: 10px; font-weight: bold; fill: #e65100; }
      .arrow-label { font-size: 9.5px; fill: #546e7a; font-weight: bold; }
      .legend-text { font-size: 9.5px; fill: #455a64; }
    </style>
    <filter id="shadow" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="2" flood-color="#90a4ae" flood-opacity="0.25"/>
    </filter>
    <marker id="arrowDark" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#546e7a"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e65100"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbff"/>
      <stop offset="100%" stop-color="#e8eaf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="8" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="784" height="434" rx="6" fill="none" stroke="#c5cae9" stroke-width="0.8"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" class="title">동물 온톨로지 (Animal Ontology) 예시</text>
  <text x="400" y="52" text-anchor="middle" class="subtitle">클래스 계층, 인스턴스, 속성 및 관계</text>
  <line x1="200" y1="62" x2="600" y2="62" stroke="#c5cae9" stroke-width="1"/>

  <!-- ==================== CLASS HIERARCHY (Blue rounded rects) ==================== -->

  <!-- 생물 (Living Thing) — top of hierarchy -->
  <g filter="url(#shadow)">
    <rect x="325" y="78" width="110" height="38" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  </g>
  <text x="380" y="102" text-anchor="middle" class="class-label">생물</text>

  <!-- Arrow: 생물 → 동물 -->
  <line x1="380" y1="116" x2="380" y2="148" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <rect x="390" y="124" width="32" height="16" rx="3" fill="#fff" stroke="#b0bec5" stroke-width="0.8"/>
  <text x="406" y="135" text-anchor="middle" class="arrow-label" style="font-size:8px">is-a</text>

  <!-- 동물 (Animal) -->
  <g filter="url(#shadow)">
    <rect x="315" y="152" width="130" height="38" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  </g>
  <text x="380" y="176" text-anchor="middle" class="class-label">동물 (Animal)</text>

  <!-- Arrow: 동물 → 포유류 -->
  <line x1="380" y1="190" x2="380" y2="222" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <rect x="390" y="198" width="32" height="16" rx="3" fill="#fff" stroke="#b0bec5" stroke-width="0.8"/>
  <text x="406" y="209" text-anchor="middle" class="arrow-label" style="font-size:8px">is-a</text>

  <!-- 포유류 (Mammal) -->
  <g filter="url(#shadow)">
    <rect x="305" y="226" width="150" height="38" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  </g>
  <text x="380" y="250" text-anchor="middle" class="class-label">포유류 (Mammal)</text>

  <!-- Branch: 포유류 → 개 (left) -->
  <path d="M340,264 L340,280 Q340,290 330,290 L230,290 Q220,290 220,300 L220,308" fill="none" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <rect x="260" y="280" width="32" height="16" rx="3" fill="#fff" stroke="#b0bec5" stroke-width="0.8"/>
  <text x="276" y="291" text-anchor="middle" class="arrow-label" style="font-size:8px">is-a</text>

  <!-- Branch: 포유류 → 고양이 (right) -->
  <path d="M420,264 L420,280 Q420,290 430,290 L530,290 Q540,290 540,300 L540,308" fill="none" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <rect x="468" y="280" width="32" height="16" rx="3" fill="#fff" stroke="#b0bec5" stroke-width="0.8"/>
  <text x="484" y="291" text-anchor="middle" class="arrow-label" style="font-size:8px">is-a</text>

  <!-- 개 (Dog) -->
  <g filter="url(#shadow)">
    <rect x="170" y="312" width="100" height="38" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  </g>
  <text x="220" y="336" text-anchor="middle" class="class-label">개 (Dog)</text>

  <!-- 고양이 (Cat) -->
  <g filter="url(#shadow)">
    <rect x="490" y="312" width="100" height="38" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  </g>
  <text x="540" y="336" text-anchor="middle" class="class-label">고양이 (Cat)</text>

  <!-- ==================== INSTANCES (Green ellipses) ==================== -->

  <!-- 바둑이 — instance of 개 -->
  <line x1="200" y1="350" x2="160" y2="378" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <rect x="108" y="362" width="55" height="14" rx="3" fill="#fff" stroke="#a5d6a7" stroke-width="0.8"/>
  <text x="135" y="373" text-anchor="middle" style="font-size:7.5px; fill:#2e7d32; font-weight:bold; font-family:sans-serif;">instance-of</text>

  <g filter="url(#shadow)">
    <ellipse cx="120" cy="400" rx="60" ry="22" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  </g>
  <text x="120" y="404" text-anchor="middle" class="instance-label">바둑이</text>

  <!-- 나비 — instance of 고양이 -->
  <line x1="560" y1="350" x2="600" y2="378" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <rect x="578" y="362" width="55" height="14" rx="3" fill="#fff" stroke="#a5d6a7" stroke-width="0.8"/>
  <text x="605" y="373" text-anchor="middle" style="font-size:7.5px; fill:#2e7d32; font-weight:bold; font-family:sans-serif;">instance-of</text>

  <g filter="url(#shadow)">
    <ellipse cx="640" cy="400" rx="55" ry="22" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  </g>
  <text x="640" y="404" text-anchor="middle" class="instance-label">나비</text>

  <!-- ==================== PROPERTIES (Orange small rects) ==================== -->

  <!-- Properties connected to 동물 class -->
  <!-- 이름 -->
  <g filter="url(#shadow)">
    <rect x="560" y="100" width="70" height="30" rx="6" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.8"/>
  </g>
  <text x="595" y="119" text-anchor="middle" class="prop-label">이름</text>

  <!-- 나이 -->
  <g filter="url(#shadow)">
    <rect x="650" y="100" width="70" height="30" rx="6" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.8"/>
  </g>
  <text x="685" y="119" text-anchor="middle" class="prop-label">나이</text>

  <!-- 먹이 -->
  <g filter="url(#shadow)">
    <rect x="650" y="150" width="70" height="30" rx="6" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.8"/>
  </g>
  <text x="685" y="169" text-anchor="middle" class="prop-label">먹이</text>

  <!-- Arrows from 동물 to properties -->
  <path d="M445,165 L500,165 Q510,165 510,155 L510,118 Q510,108 520,108 L555,115" fill="none" stroke="#e65100" stroke-width="1.3" marker-end="url(#arrowOrange)"/>
  <path d="M445,170 L520,170 Q530,170 530,160 L530,118 Q530,108 540,108 L555,115" fill="none" stroke="#e65100" stroke-width="1.3" stroke-opacity="0" />
  <line x1="510" y1="115" x2="555" y2="115" stroke="#e65100" stroke-width="1.3" stroke-opacity="0"/>

  <!-- Simpler arrows -->
  <line x1="445" y1="163" x2="556" y2="115" stroke="#e65100" stroke-width="1.2" marker-end="url(#arrowOrange)"/>
  <line x1="445" y1="168" x2="646" y2="115" stroke="#e65100" stroke-width="1.2" marker-end="url(#arrowOrange)"/>
  <line x1="445" y1="175" x2="646" y2="165" stroke="#e65100" stroke-width="1.2" marker-end="url(#arrowOrange)"/>

  <!-- has-property label -->
  <rect x="488" y="130" width="65" height="16" rx="3" fill="#fff" stroke="#ffcc80" stroke-width="0.8"/>
  <text x="520" y="141" text-anchor="middle" style="font-size:8px; fill:#e65100; font-weight:bold; font-family:sans-serif;">has-property</text>

  <!-- ==================== PROPERTY VALUES for 바둑이 ==================== -->
  <g transform="translate(30, 0)">
    <rect x="15" y="340" width="55" height="18" rx="4" fill="#fff8e1" stroke="#ffb74d" stroke-width="1"/>
    <text x="42" y="353" text-anchor="middle" style="font-size:8px; fill:#e65100; font-family:sans-serif;">이름: 바둑이</text>
  </g>
  <g transform="translate(30, 0)">
    <rect x="15" y="360" width="55" height="18" rx="4" fill="#fff8e1" stroke="#ffb74d" stroke-width="1"/>
    <text x="42" y="373" text-anchor="middle" style="font-size:8px; fill:#e65100; font-family:sans-serif;">나이: 3</text>
  </g>
  <g transform="translate(30, 0)">
    <rect x="15" y="380" width="55" height="18" rx="4" fill="#fff8e1" stroke="#ffb74d" stroke-width="1"/>
    <text x="42" y="393" text-anchor="middle" style="font-size:8px; fill:#e65100; font-family:sans-serif;">먹이: 사료</text>
  </g>
  <line x1="85" y1="375" x2="90" y2="400" stroke="#ffb74d" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- ==================== PROPERTY VALUES for 나비 ==================== -->
  <g transform="translate(0, 0)">
    <rect x="710" y="340" width="55" height="18" rx="4" fill="#fff8e1" stroke="#ffb74d" stroke-width="1"/>
    <text x="737" y="353" text-anchor="middle" style="font-size:8px; fill:#e65100; font-family:sans-serif;">이름: 나비</text>
  </g>
  <g transform="translate(0, 0)">
    <rect x="710" y="360" width="55" height="18" rx="4" fill="#fff8e1" stroke="#ffb74d" stroke-width="1"/>
    <text x="737" y="373" text-anchor="middle" style="font-size:8px; fill:#e65100; font-family:sans-serif;">나이: 2</text>
  </g>
  <g transform="translate(0, 0)">
    <rect x="710" y="380" width="55" height="18" rx="4" fill="#fff8e1" stroke="#ffb74d" stroke-width="1"/>
    <text x="737" y="393" text-anchor="middle" style="font-size:8px; fill:#e65100; font-family:sans-serif;">먹이: 생선</text>
  </g>
  <line x1="710" y1="375" x2="700" y2="400" stroke="#ffb74d" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- ==================== LEGEND ==================== -->
  <rect x="20" y="78" width="140" height="100" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1" opacity="0.9"/>
  <text x="90" y="95" text-anchor="middle" style="font-size:10px; font-weight:bold; fill:#37474f; font-family:sans-serif;">범례 (Legend)</text>

  <!-- Class -->
  <rect x="30" y="103" width="30" height="16" rx="5" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
  <text x="68" y="115" class="legend-text">클래스 (Class)</text>

  <!-- Instance -->
  <ellipse cx="45" cy="133" rx="15" ry="9" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="68" y="137" class="legend-text">인스턴스 (Instance)</text>

  <!-- Property -->
  <rect x="30" y="149" width="30" height="16" rx="4" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="68" y="161" class="legend-text">속성 (Property)</text>
</svg>